name: Python Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Nothing here writes to the repo
permissions:
  contents: read

# A new push to a PR cancels its older runs; runs on master always finish, so
# each commit there keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-uv caches uv's downloads on its own (enable-cache defaults to auto)
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests
      run: uv run --locked python -m unittest test_furby -v

  # The show engine and firmware run on MicroPython on the board. Homebrew has
  # MicroPython's Unix port, so the two tests that need it run for real here
  # instead of skipping; the test job already runs everything else. On macOS
  # because Homebrew has MicroPython, which also makes it the place for Swift.
  micropython:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.12'
    - name: Install MicroPython
      run: brew install micropython
    - name: Run the MicroPython tests
      run: >-
        uv run --locked python -m unittest -v
        test_furby.TestHalloween.test_show_runs_on_micropython
        test_furby.TestFirmware.test_compiles_for_micropython
    - name: Compile the board's files with mpy-cross
      run: |
        uvx mpy-cross -o /tmp/furbyshow.mpy furbyshow.py
        uvx mpy-cross -o /tmp/main.mpy firmware/main.py
        uvx mpy-cross -o /tmp/remote.mpy firmware/remote.py
    # The iPhone remote's protocol package; the app itself needs an iPhone to be useful
    - name: Test the iPhone remote's protocol
      run: swift test --package-path ios/FurbyRemoteKit

  # The real show.toml with placeholder tones for its (gitignored) clips, run
  # on virtual Furbies. TestRealShow already fails the build on a silent or
  # skipped line; this prints the scene-by-scene report and the eye check.
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
    - name: Build the show with placeholder clips
      run: uv run --locked python tools/ci_show.py
    - name: Play every scene on virtual Furbies
      run: uv run --locked python emulate.py build/ci-show/show.json
    - name: Play every scene with the slowest measured movements
      run: uv run --locked python emulate.py --worst build/ci-show/show.json
    # Informational for now: eyecheck's rules are still being settled against
    # what real Furbies show, so a failure is flagged as a warning instead of
    # failing the build. Make it gate once its rules and show.toml agree.
    - name: Check the eyes the way a Furby composes them
      run: |
        if ! out=$(uv run --locked python eyecheck.py build/ci-show/pink.dlc build/ci-show/blue.dlc 2>&1); then
          echo "::warning title=eyecheck::The show's eyes may not display on a Furby; see this step's log"
        fi
        echo "$out"
        { echo '### eyecheck'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
    # Only the dev group: ruff doesn't need Pillow, bleak or the codec
    - run: uv run --locked --only-group dev ruff check .
    - run: uv run --locked --only-group dev ruff format --check .
    # Workflow files, including the shell in their run: steps (via shellcheck)
    - run: uvx --from actionlint-py actionlint
    # Relative links and #anchors in the Markdown docs; --offline skips
    # external URLs, so a flaky site can't fail the build
    - uses: lycheeverse/lychee-action@v2
      with:
        args: --offline --include-fragments --no-progress './**/*.md'
        jobSummary: false

  # Generated audio and DLCs belong in build/, which is gitignored. Hasbro's
  # stock DLC, anything built from it, cloned Furby voices and audio of unknown
  # origin must never be committed, so fail on any DLC, and on any audio or
  # archive but the Toccata rendered by tools/toccata.py.
  no-generated-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Check for committed audio, DLCs and build output
      run: |
        allowed='^audio/new_audio/toccata_bwv565_opening\.wav$'
        found=$(git ls-files 'build/*' '*.wav' '*.mp3' '*.m4a' '*.aiff' '*.a18' '*.dlc' '*.zip' | grep -Ev "$allowed" || true)
        if [ -n "$found" ]; then
          echo "These generated files shouldn't be committed (keep them in build/):"
          echo "$found"
          exit 1
        fi
