# The Halloween show: what each Furby can say, and the scenes that string
# them together. halloween.py builds each Furby's DLC from this file, and
# porch.py plays the scenes. Clip paths are relative to the repo root and live
# in build/ (gitignored), so a fresh copy of the repo has none of them yet:
# build/sfx comes from audioutils/freesound_fetch.py, and build/cloned holds the
# voice lines, which you record or generate yourself. The comment after each
# voice line is what it says. Any format ffmpeg reads works; change a path to
# match your file. See "Set up the Halloween show" in README.md.

[show]
gap = 0.6           # seconds between one line ending and the next starting
every = [20, 45]    # seconds between scenes, picked at random in this range
cooldown = 20       # seconds after a scene when the button or motion sensor is ignored
# Eyes: each clip shows one eye animation, from its Furby's eyes list (below).
# Preview them all with: uv run spooky_eyes.py --preview (writes build/eyes/).
eye_frames = 38            # frames per eye animation: 38 is the stock length; up to 95
one_eye_animation = false  # true: every clip shows its Furby's first eyes, the one layout
                           # tested on a Furby. Use it if uv run spooky_eyes.py --probe
                           # shows that a second animation (0x8402) doesn't play.

# Pink is the evil Furby: demon eyes, scary lines.
[furbies.pink]
# Clips take turns through these, in clip-name order; give a clip its own with
# eyes = "storm" in its table. The first is the main one. Each theme costs
# about 37 KB of the DLC. Themes: demon, pumpkin, storm, bloodshot, ghost, hypno.
eyes = ["demon", "bloodshot", "storm"]
antenna = [255, 0, 0]  # antenna color while it speaks (red, green, blue)

[furbies.pink.clips]
cackle = "build/sfx/witch-cackle-0.wav"
cackle2 = "build/sfx/witch-cackle-1.wav"
scream = { path = "build/sfx/scream-0.wav", eyes = "storm" }
moan = "build/sfx/ghost-moan-0.wav"
midnight = "build/cloned/pink_dontfeed.wav"  # "Don't feed Kah after midnight..."
boo = "build/cloned/pink_boo.wav"  # "Boo! Kah scare you?"
dare = "build/cloned/pink_dare.wav"  # "Take two... if you DARE."
watching = "build/cloned/pink_watching.wav"  # "Kah is watching you..."
yourcandy = { path = "build/cloned/pink_yourcandy.wav", before = 0.4 }  # "Kah love... your CANDY."
trick = { path = "build/cloned/pink_trick.wav", before = 0.4 }  # "Trick."
scariest = "build/cloned/pink_laugh.wav"  # "Mwahaha! Kah is the scariest Furby!"
# Music: a clip can be a table that cuts a snippet. Audio costs about 2 KB a
# second, and each DLC must stay under about 350 KB. The opening bars are
# enough to recognize, and a Furby's speaker doesn't do music any favors.
toccata = { path = "audio/new_audio/toccata_in_d_minor_16khz.wav", seconds = 5 }
# The Ghostbusters theme is copyrighted, so it isn't in the repo: put your own
# copy at this path (any format ffmpeg reads). Until then, its scenes are skipped.
# "before" holds a beat after "Who you gonna call?" for the kids to shout it:
# 0.6 + 1.4 = 2 seconds, since a group is slow to start a shout.
ghostbusters = { path = "build/music/ghostbusters.mp3", start = "0:11", seconds = 6, before = 1.4, optional = true }

# Blue is the good Furby: jack-o'-lantern eyes, friendly lines that undercut pink.
[furbies.blue]
eyes = ["pumpkin", "ghost", "hypno"]
antenna = [255, 100, 0]

[furbies.blue.clips]
takeone = "build/cloned/blue_takeone.wav"  # "Happy Halloween! Take one!"
happy = "build/cloned/blue_happy.wav"  # "Happy Halloween, noo-lah!"
what = "build/cloned/blue_what.wav"  # "What was that?!"
scared = "build/cloned/blue_scared.wav"  # "Kah scared! Hold me!"
thanks = "build/cloned/blue_thanks.wav"  # "Yay! Take one, take one!"
door = "build/sfx/creaky-door-0.wav"
whocall = "build/cloned/blue_whocall.wav"  # "Who you gonna call?"
song = "build/cloned/blue_song.wav"  # "Ooh! Kah love this song!"
halloween = "build/cloned/blue_halloween.wav"  # "Kah love Halloween!"
trickortreat = "build/cloned/blue_trickortreat.wav"  # "Trick or treat!"
# Punchlines wait a little longer than the usual gap: 0.6 + 0.4 = 1 second.
gotcha = { path = "build/cloned/blue_gotcha.wav", before = 0.4 }  # "Hee hee! Gotcha!"
hi = { path = "build/cloned/blue_hi.wav", before = 0.4 }  # "Kah watching too! Hi!"
hascandy = { path = "build/cloned/blue_hascandy.wav", before = 0.4 }  # "Kah not scared. Kah has candy."
ghostbusters = { path = "build/music/ghostbusters.mp3", start = "0:11", seconds = 6, before = 1.4, optional = true }

# Each scene plays its steps in order: "<furby>.<clip>". Join clips with "+"
# to play them on both Furbies at once, e.g. a duet.
#
# greeting = true saves a scene for when someone arrives: the button or motion
# sensor plays one of these, and the timer plays the rest.
[[scenes]]
greeting = true
steps = ["blue.takeone", "pink.dare"]

[[scenes]]
greeting = true
steps = ["blue.happy", "pink.boo"]  # ends on a question, so the kids answer it

[[scenes]]
greeting = true
steps = ["blue.thanks", "pink.scariest", "blue.hascandy"]

[[scenes]]
greeting = true
steps = ["blue.trickortreat", "pink.trick"]

# Call and response only works when someone's there to shout back
[[scenes]]
greeting = true
steps = ["blue.whocall", "pink.ghostbusters + blue.ghostbusters"]

[[scenes]]
steps = ["pink.cackle", "blue.what"]

[[scenes]]
steps = ["pink.midnight", "blue.scared"]

[[scenes]]
steps = ["blue.door", "pink.scream", "blue.gotcha"]

[[scenes]]
steps = ["pink.watching", "blue.hi"]

# Pure atmosphere, no punchline
[[scenes]]
steps = ["pink.moan", "pink.cackle2"]

[[scenes]]
steps = ["pink.toccata", "blue.song"]

# Pink finally lands one
[[scenes]]
steps = ["blue.halloween", "pink.yourcandy"]

[[scenes]]
steps = ["blue.door", "pink.cackle", "blue.gotcha"]
